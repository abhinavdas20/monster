services:
  db:
    image: postgres:16-alpine
    container_name: monster-tamers-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: monster_tamers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monster_tamers"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monster-tamers-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/monster_tamers?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run db:push && npm run db:seed && npm run dev"

volumes:
  postgres_data:
